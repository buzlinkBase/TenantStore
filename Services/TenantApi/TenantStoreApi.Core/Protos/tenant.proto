syntax = "proto3";

option csharp_namespace = "Onepunch.Auth.Core"; 

package tenant.core;

service GetTenantService {
  rpc GetInfo  (TenantRequest) returns (TenantInfoResponse);
  rpc ResolveMembership (MembershipRequest) returns (MembershipResponse);
  rpc GetActiveMemberships (UserMembershipsRequest) returns (UserMembershipsResponse);
  // Synchronously activates (or creates) a user's membership on a tenant -- used by invitation
  // acceptance so the token minted right after already carries the joined tenant's roles and
  // permissions, instead of waiting on the async UserJoin/InvitationAccepted events.
  rpc ActivateMembership (ActivateMembershipRequest) returns (MembershipResponse);
  // No privilege escalation (TenantApi RoleGrantPolicy): whether this member may grant these roles,
  // checked when AuthApi sends an invitation with a non-default role.
  rpc CheckRoleGrant (RoleGrantRequest) returns (RoleGrantResponse);
  // Subscription limits Tenant Service owns: "companies.max" for an account (user_id) before
  // AuthApi creates a workspace, "admins.max" for a company (tenant_id) before it invites
  // `requested` more admins.
  rpc CheckPlanAllowance (PlanAllowanceRequest) returns (PlanAllowanceResponse);
  // Whether a company may be changed at all: refused while its subscription is read-only or an
  // operator stopped it -- AuthApi asks before every invitation, which the admin-seat limit alone
  // doesn't cover (employee invites, resends).
  rpc CheckCompanyWritable (CompanyWritableRequest) returns (PlanAllowanceResponse);
  // Client-portal access (Category=ClientUser memberships). Never mixed into the HRIS membership
  // calls above: a client user has no HRIS tenant, roles or token claims.
  // What a user may do within one client; found=false when they have no standing there.
  rpc ResolveClientMembership (ClientMembershipRequest) returns (ClientMembershipResponse);
  // Every client a user belongs to, across companies (the portal's client picker).
  rpc ListClientMemberships (UserMembershipsRequest) returns (ClientMembershipsResponse);
  // The client portal tells Tenant Service about a client it created or changed.
  rpc UpsertClientEntity (UpsertClientEntityRequest) returns (UpsertClientEntityResponse);
  // AuthApi asks before sending a client-user invitation: may this person invite this email to this
  // client with these roles? Nothing is written.
  rpc CheckClientInvite (CheckClientInviteRequest) returns (CheckClientInviteResponse);
  // Invitation acceptance: makes the user a client user of that client with the invited roles.
  // Idempotent.
  rpc GrantClientAccess (GrantClientAccessRequest) returns (GrantClientAccessResponse);
}

message CheckClientInviteRequest {
  string inviter_user_id = 1;
  string client_entity_id = 2;
  string email = 3;
  repeated string role_ids = 4;
}

message CheckClientInviteResponse {
  bool allowed = 1;
  string error = 2;
  string tenant_id = 3;
  string tenant_name = 4;
  string client_name = 5;
}

message GrantClientAccessRequest {
  string user_id = 1;
  string client_entity_id = 2;
  string email = 3;
  string full_name = 4;
  repeated string role_ids = 5;
}

message GrantClientAccessResponse {
  bool ok = 1;
  string error = 2;
}

message ClientMembershipRequest {
  string user_id = 1;
  string client_entity_id = 2;
}

message ClientMembershipResponse {
  bool found = 1;
  ClientMembershipEntry membership = 2;
}

message ClientMembershipsResponse {
  repeated ClientMembershipEntry memberships = 1;
}

message ClientMembershipEntry {
  string client_entity_id = 1;
  string client_name = 2;
  string tenant_id = 3;
  string tenant_name = 4;
  // Active only when the person, their company link and the client are all on; permissions are
  // empty otherwise.
  string status = 5;
  repeated string roles = 6;
  repeated string permissions = 7;
}

message UpsertClientEntityRequest {
  string tenant_id = 1;
  string client_entity_id = 2;
  // The HRIS client id, empty for a client created in the portal.
  string external_id = 3;
  string name = 4;
  bool active = 5;
}

message UpsertClientEntityResponse {
  bool ok = 1;
}

message PlanAllowanceRequest {
  string user_id = 1;
  string tenant_id = 2;
  string limit_key = 3;
  int32 requested = 4;
}

message PlanAllowanceResponse {
  bool allowed = 1;
  // A SubscriptionProblemTypes value when refused, e.g. "plan-limit-reached".
  string problem_type = 2;
  string error = 3;
  int32 max = 4;
  bool unlimited = 5;
  int32 used = 6;
}

message CompanyWritableRequest {
  string tenant_id = 1;
}

message TenantRequest  {
  string tenant_id = 1;
}

message TenantInfoResponse {
  string tenant_id = 1;
  string name=2;
}

message MembershipRequest {
  string user_id = 1;
  string tenant_id = 2;
}

message MembershipResponse {
  bool found = 1;
  repeated string roles = 2;
  string status = 3;
  string tenant_name = 4;
  repeated string permissions = 5;
  // Set when ActivateMembership refused to join (see ActivationMode); nothing was changed.
  bool denied = 6;
  string deny_reason = 7;
}

// How strictly ActivateMembership vets the join. LEGACY keeps the old create-or-reactivate
// behavior; the invitation flow uses the other two so a revoked/removed invite can't be redeemed.
enum ActivationMode {
  ACTIVATION_MODE_LEGACY = 0;
  // First acceptance: needs the still-pending Invited placeholder for the email.
  ACTIVATION_MODE_ACCEPT_INVITE = 1;
  // Re-opening an already accepted invitation: needs a membership that is still Active.
  ACTIVATION_MODE_REPLAY = 2;
}

message ActivateMembershipRequest {
  string user_id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string email = 4;
  string full_name = 5;
  repeated string roles = 6;
  ActivationMode mode = 7;
}

message UserMembershipsRequest {
  string user_id = 1;
}

message UserMembershipsResponse {
  repeated MembershipEntry memberships = 1;
}

message MembershipEntry {
  string tenant_id = 1;
  string tenant_name = 2;
  repeated string roles = 3;
  string status = 4;
  repeated string permissions = 5;
}

message RoleGrantRequest {
  string user_id = 1;
  string tenant_id = 2;
  repeated string roles = 3;
}

message RoleGrantResponse {
  bool allowed = 1;
  string error = 2;
}
