<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color:#f4f4f4; padding:20px;">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; margin:auto; background:#ffffff; border-radius:8px; overflow:hidden;">
        <tr>
            <td style="background:#0078D7; color:#ffffff; padding:20px; text-align:center;">
                <h2>Confirm Your Email</h2>
            </td>
        </tr>
        <tr>
            <td style="padding:20px; color:#333;">
                <p>Hello,</p>
                <p>Thank you for registering. Please confirm your email by clicking the button below:</p>
                <p style="text-align:center;">
                    <a href="{{confirmationLink}}"
                       style="background:#0078D7; color:#fff; padding:12px 24px; text-decoration:none; border-radius:4px;">
                        Confirm Email
                    </a>
                </p>
                <p>If you didn’t request this, you can ignore this email.</p>
            </td>
        </tr>
        <tr>
            <td style="background:#f4f4f4; padding:10px; text-align:center; font-size:12px; color:#777;">
                &copy; 2026 Your Company
            </td>
        </tr>
    </table>
</body>
</html>
