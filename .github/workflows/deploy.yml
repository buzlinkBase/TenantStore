name: main-deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Detect changes in path directories
    # Note: Adjust paths according to your repository structure
    - name: Check path changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          auth:
            - 'Services/AuthApi/**'
            - 'Services/Shared/**'
            - 'Directory.Packages.props'
            - 'Dockerfile'
          tenant:
            - 'Services/TenantApi/**'
            - 'Services/Shared/**'
            - 'Directory.Packages.props'
            - 'Dockerfile'
          notification:
            - 'Services/NotificationApi/**'
            - 'Services/Shared/**'
            - 'Directory.Packages.props'
            - 'Dockerfile'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 2. Build and Push Auth API (only if auth code or Dockerfile changed)
    - name: Build and push Auth API
      if: steps.changes.outputs.auth == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: auth-service
        push: true
        tags: |
          jhoncee2018/hrms-auth-api:latest
          jhoncee2018/hrms-auth-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 3. Build and Push Tenant API (only if tenant code or Dockerfile changed)
    - name: Build and push Tenant API
      if: steps.changes.outputs.tenant == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: tenant-service
        push: true
        tags: |
          jhoncee2018/hrms-tenant-api:latest
          jhoncee2018/hrms-tenant-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 4. Build and Push Notification Service (only if notification code or Dockerfile changed)
    - name: Build and push Notification Service
      if: steps.changes.outputs.notification == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        target: notification-service
        push: true
        tags: |
          jhoncee2018/hrms-notification:latest
          jhoncee2018/hrms-notification:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # 5. Deploy to Droplet
    - name: SSH into Droplet and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.DIGITALOCEAN_DROPLET_IP }}
        username: ${{ secrets.DIGITALOCEAN_DROPLET_USERNAME }}
        key: ${{ secrets.DIGITALOCEAN_SSH_PRIVATE_KEY }}
        script: |
          cd tenant-api/
          
          echo "Pulling updated images..."
          docker compose pull
          
          echo "Updating modified containers..."
          docker compose up -d
          
          echo "Cleaning up dangling images..."
          docker image prune -f